[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dialogue-summarizer"
version = "0.1.0"
description = "Fine-tune and serve Transformer models for dialogue summarization."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.26",
    "datasets>=2.18,<4",
    "protobuf>=4.25,<7",
    "rouge-score>=0.1.2,<1",
    "sentencepiece>=0.2,<1",
    "torch>=2.1",
    "transformers>=4.46,<5",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
]

[project.scripts]
dialogue-train = "dialogue_summarizer.train:main"
dialogue-evaluate = "dialogue_summarizer.evaluate:main"
dialogue-summarize = "dialogue_summarizer.inference:main"

[tool.setuptools.packages.find]
where = ["src"]
